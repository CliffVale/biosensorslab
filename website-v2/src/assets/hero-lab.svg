<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#047857" stroke-width="1">
    <path d="M0 60h640M0 120h640M0 180h640M0 240h640M0 300h640M0 360h640M0 420h640M80 0v480M160 0v480M240 0v480M320 0v480M400 0v480M480 0v480M560 0v480"/>
  </g>

  <!-- Central chip -->
  <rect x="150" y="90" width="340" height="300" rx="28" fill="url(#chip)" opacity="0.14"/>
  <rect x="150" y="90" width="340" height="300" rx="28" stroke="#059669" stroke-width="2.5" opacity="0.35"/>
  <!-- chip pins -->
  <g stroke="#059669" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <path d="M190 78v-24M270 78v-24M350 78v-24M430 78v-24M510 78v-24"/>
    <path d="M190 402v24M270 402v24M350 402v24M430 402v24M510 402v24"/>
    <path d="M138 130h-24M138 210h-24M138 290h-24M138 370h-24"/>
    <path d="M502 130h24M502 210h24M502 290h24M502 370h24"/>
  </g>

  <!-- DNA helix inside chip -->
  <g transform="translate(320,240)">
    <g stroke="#065f46" stroke-width="3.5" fill="none" opacity="0.9">
      <path d="M-60,-80 Q -35,-40 -60,0 Q -85,40 -60,80" />
      <path d="M60,-80 Q 35,-40 60,0 Q 85,40 60,80" />
      <path d="M-60,-80 Q 35,-40 60,0 Q 35,40 60,80" />
      <path d="M60,-80 Q -35,-40 -60,0 Q -35,40 -60,80" />
    </g>
    <g fill="#22d3ee">
      <rect x="-70" y="-86" width="14" height="10" rx="3"/>
      <rect x="56" y="-86" width="14" height="10" rx="3"/>
      <rect x="4" y="-38" width="14" height="10" rx="3"/>
      <rect x="-70" y="6" width="14" height="10" rx="3"/>
      <rect x="56" y="6" width="14" height="10" rx="3"/>
      <rect x="4" y="52" width="14" height="10" rx="3"/>
      <rect x="-70" y="76" width="14" height="10" rx="3"/>
      <rect x="56" y="76" width="14" height="10" rx="3"/>
    </g>
  </g>

  <!-- Sample drop -->
  <path d="M470 150c0-20 18-34 18-34s18 14 18 34a18 18 0 1 1-36 0z" fill="url(#drop)"/>
  <ellipse cx="488" cy="152" rx="7" ry="5" fill="#fff" opacity="0.5"/>

  <!-- signal line -->
  <path d="M150 340h45l20-28 22 48 22-64 20 30 18-18h85" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="382" cy="308" r="5" fill="#f59e0b"/>
</svg>