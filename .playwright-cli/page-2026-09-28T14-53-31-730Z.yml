      - generic [ref=e60]:
        - link [ref=e61] [cursor=pointer]:
          - /url: /biosensorslab/research/urosmart
          - generic [ref=e62]:
            - heading "UroSmart — Non-Invasive Aptasensor Platform for Pancreatic Cancer Detection" [level=3] [ref=e63]
            - paragraph [ref=e64]: A fully integrated platform combining aseptic urine collection, automated microfluidic dispensing, and aptamer-based electrochemical sensing for point-of-care detection of CA 19.9 — the only clinically approved biomarker for pancreatic cancer.
        - link [ref=e65] [cursor=pointer]:
          - /url: /biosensorslab/research/malaria-instrument-free
          - generic [ref=e66]:
            - heading "Instrument-Free Malaria Detection" [level=3] [ref=e67]
            - paragraph [ref=e68]: Detection of pan-malaria and Plasmodium falciparum using dye-based reactions catalyzed by the biomarker enzymes Plasmodium lactate dehydrogenase (pLDH) and Plasmodium falciparum glutamate dehydrogenase (PfGDH), through both instrument-based and instrument-free approaches.
        - link [ref=e69] [cursor=pointer]:
          - /url: /biosensorslab/research/has-chemical-antibody
          - generic [ref=e70]:
            - heading "One-Step Selection of 'Chemical Antibody' using HAS" [level=3] [ref=e71]
            - paragraph [ref=e72]: A totally new concept for aptamer discovery — Hydrogel for Aptamer Selection (HAS) — that selects aptamers ('chemical antibodies') in a single step in just 60 hours.
        - link [ref=e73] [cursor=pointer]:
          - /url: /biosensorslab/research/wearable-cortisol-patch
          - generic [ref=e74]:
            - heading "A Non-Invasive Wearable Stress Patch for Real-Time Cortisol Monitoring" [level=3] [ref=e75]
            - paragraph [ref=e76]: A wearable patch based on soft microfluidics and flexible electrodes functionalized with a pseudoknot-assisted conformation-switching aptamer for pH-calibrated, continuous, non-invasive cortisol monitoring in sweat.
