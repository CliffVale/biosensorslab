version: 2
updates:
  # Website dependencies (Astro, Tailwind, etc.) live in website-v2/
  - package-ecosystem: "npm"
    directory: "/website-v2"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # GitHub Actions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
